# yaml-language-server: $schema=../schemas/cv.schema.json
header:
  name: Alban Dericbourg
  title:
    fr: Ingénieur logiciel senior (indépendant)
    en: Freelance Senior Software Engineer
  summary:
    fr: >-
      Ingénieur logiciel senior, j'ai 15 ans d'expérience, notamment au sein de trois licornes
      françaises (Criteo, BlaBlaCar, Mirakl). Je conçois et fiabilise des services back-end dans des
      systèmes distribués à fort trafic, sur de grandes bases de code existantes comme sur des
      services neufs. Je pars du problème à résoudre et de ce qu'il apporte aux utilisateurs pour
      faire mes choix techniques. La fiabilité est le domaine qui m'intéresse le plus : observabilité,
      SLO, démarche SRE. Je pilote aussi des projets impliquant plusieurs équipes, de la découverte au
      déploiement, et j'aime aider une équipe à avancer ensemble. J'habite à la campagne entre
      Poitiers et Angoulême et je travaille en full remote depuis 2019 (BlaBlaCar, Mirakl). Je
      m'assure que les décisions sont mises à l'écrit, et j'ai l'habitude de venir sur site 2 à 4
      jours par mois.
    en: >-
      Senior software engineer, I have 15 years of experience, notably in three French unicorns
      (Criteo, BlaBlaCar, Mirakl). I design and harden back-end services in high-traffic distributed
      systems, on large existing codebases as well as on new services. I start from the problem to
      solve and what it brings to users to make my technical choices. Reliability is the area that
      interests me most: observability, SLOs, an SRE approach. I also lead projects involving several
      teams, from discovery to rollout, and I like helping a team move forward together. I live in
      the countryside between Poitiers and Angoulême and have worked fully remote since 2019
      (BlaBlaCar, Mirakl). I make sure decisions are written down, and I usually come on-site 2 to 4
      days a month.

experiences:
  - company: Mirakl
    location: Paris — full remote
    url: https://www.mirakl.com
    roles:
      - role:
          fr: Ingénieur logiciel senior (indépendant)
          en: Senior Software Engineer (freelance)
        department: Connect (post-sales)
        start: "2026-04"
        description:
          fr: |
            Mirakl Connect est le réseau B2B reliant opérateurs (propriétaires de marketplaces) et vendeurs. L'équipe _post-sales_ y est responsable du cycle de vie des commandes (fort volume, système distribué).

            J'ai rejoint l'équipe en renfort, et j'ai aussi travaillé sur sa façon de concevoir et de livrer :
             * Refonte du processus de design doc : ajout des sujets souvent oubliés (capacité / volumétrie, observabilité, tests), revues recentrées sur les objectifs et les arbitrages
             * Modèles de documents avec des consignes par section
             * Création de _plugins_ et de _skills_ Claude Code pour restructurer les design docs et les rendre plus lisibles, avec moins d'allers-retours en revue
             * Développement assisté par IA au quotidien, avec la revue de code et les tests comme garde-fous
          en: |
            Mirakl Connect is the B2B network connecting operators (marketplace owners) and sellers. The post-sales team owns the order lifecycle there (high-volume, distributed system).

            I joined to reinforce the team, and also worked on how it designs and delivers:
             * Reworked the design-doc process: added often-missed topics (capacity / volumetry, observability, testing), refocused reviews on goals and trade-offs
             * Document templates with guidance for each section
             * Built Claude Code plugins and skills that restructure design docs to make them easier to read, with fewer review round-trips
             * Day-to-day AI-assisted development, with code review and tests as safeguards
        tags: [Java, SpringBoot, PostgreSQL, Kafka, AI, "Claude Code", Datadog]
      - role:
          fr: Ingénieur logiciel senior (indépendant)
          en: Senior Software Engineer (freelance)
        department: MPI
        start: "2025-11"
        end: "2026-03"
        description:
          fr: |
            Connecteur Mirakl ↔ Shopify pour les opérateurs de plateforme.

            Livraison d'un middleware entre Shopify et la plateforme Mirakl permettant aux propriétaires de boutiques Shopify d'ouvrir leur boutique à des vendeurs tiers.
             * Conception et implémentation du support de l'internationalisation (i18n) sur l'ensemble du connecteur
             * Mise en place des SLO, de leur définition jusqu'à leur utilisation par l'équipe
          en: |
            Mirakl ↔ Shopify connector for platform operators.

            Shipped a middleware between Shopify and the Mirakl platform, letting Shopify shop owners open their store to third-party sellers.
             * Designed and implemented internationalization (i18n) support across the connector
             * Set up SLOs, from defining them to getting the team to use them
        tags: [Java, SpringBoot, PostgreSQL, Shopify APIs, Mirakl Platform, Datadog]
    extra:
      - topic:
          fr: Détection de changements cassants d'API (OpenAPI)
          en: OpenAPI breaking change detection
        start: "2026-04"
        description:
          fr: |
            Mise en place d'outillage automatisé pour analyser les changements dans un contrat OpenAPI, en mesurer l'impact et produire un rapport de changements.

            Comprend la possibilité de bloquer un pipeline Github Actions lorsqu'un changement cassant est détecté.

            La solution repose sur l'outil open-source [oasdiff](https://github.com/oasdiff/oasdiff).
          en: |
            Set up automated tooling to evaluate changes in an OpenAPI contract, assess the impact and produce a change report.

            Includes the ability to block a GitHub Actions pipeline when a breaking change is detected.

            The solution is based on the [oasdiff](https://github.com/oasdiff/oasdiff) open-source tool.
  - company: BlaBlaCar
    location: Paris — full remote
    url: https://www.blablacar.com
    roles:
      - role:
          fr: Ingénieur logiciel senior backend
          en: Senior Backend Software Engineer
        department: Search
        start: "2021-04"
        end: "2025-10"
        description:
          fr: |
            Équipe full-stack en charge de la recherche de trajets côté passager.

             * Pilotage de projets produit de la découverte au déploiement, dont un programme de 9 mois impliquant 4 équipes
             * Refonte de l'architecture de la recherche pour suivre la croissance de l'entreprise et son offre multimodale, puis coordination d'une migration progressive, sans réécriture _big-bang_ (#NoRewrite)
             * Mise en place des SLO avec l'équipe SRE, dans l'une des premières équipes de l'entreprise à les adopter : d'abord des SLO techniques, puis des Feature SLO qui mesurent ce que vit le passager ; aide à d'autres équipes pour s'y mettre
             * Amélioration de l'observabilité des services en production et du processus de conception des nouveaux services
             * Lancement des Open Spaces (« Forum ouvert ») de l'équipe backend, pour que les ingénieurs échangent davantage entre eux
             * Point d'avancement hebdomadaire envoyé aux parties prenantes sur les projets pilotés : livré, prochaines étapes, points bloquants
             * Conception passée par l'écrit : design doc, relecture asynchrone, revue en petit comité avec un référent par équipe, puis kickoff avec toutes les équipes concernées
             * Contribution quotidienne à la livraison de l'équipe
          en: |
            Full-stack team in charge of ride search on the passenger side.

             * Drove product projects from discovery to rollout, including a 9-month program spanning 4 teams
             * Redesigned the search architecture to keep up with the company's growth and its multimodal offer, then coordinated a progressive migration, without a big-bang rewrite (#NoRewrite)
             * Set up SLOs with the SRE team, in one of the first teams in the company to adopt them: technical SLOs first, then Feature SLOs that measure what the passenger actually experiences; helped other teams get started
             * Improved the observability of production services and the design process for new services
             * Launched the backend team's Open Spaces ("Forum ouvert") so backend engineers share more with each other
             * Weekly written progress update emailed to stakeholders on the projects I led: shipped, next steps, blockers
             * Written design process: written design doc, async review, small-group peer review with one representative per team, then a kickoff with all involved teams
             * Contributed to the team's day-to-day delivery
        tags: [Java, SpringBoot, Elasticsearch, SLO, Datadog, Kubernetes, Resilience4j, Parallelism, OpenAPI, Gradle]
      - role:
          fr: Ingénieur logiciel senior backend
          en: Senior Backend Software Engineer
        department: Monetize
        start: "2019-09"
        end: "2021-04"
        description:
          fr: |
            Équipe backend, en collaboration étroite avec les équipes frontend, en charge du calcul des frais de service passagers et de l'orchestration du tunnel d'achat.

             * Extraction de services de monétisation autonomes hors du monolithe historique, et diffusion des bonnes pratiques d'architecture et de conception dans l'équipe
             * Lancement d'une démarche SRE, d'abord pour réduire le bruit des alertes et la fatigue en astreinte
             * Pilotage de la migration de Fleet/Rocket vers Docker/Kubernetes sur le périmètre de l'équipe
             * Mission transverse sur l'outillage : accélération du build et de la CI, surtout via la configuration Gradle
             * Mentorat d'un ingénieur junior
          en: |
            Backend team working closely with frontend teams, in charge of computing carpool passenger fees and orchestrating the purchase flow.

             * Extracted standalone monetization services out of the legacy monolith, and spread architecture and code-design best practices across the team
             * Started an SRE approach, first to cut alert noise and on-call fatigue
             * Led the migration from Fleet/Rocket to Docker/Kubernetes in the team's scope
             * Cross-team tooling mission: sped up the build and the CI, mostly by reworking the Gradle configuration
             * Mentored a junior engineer
        tags: [Java, SpringBoot, MariaDB, Kubernetes, Prometheus, Grafana, Kafka, RabbitMQ, Gradle]
    extra:
      - topic:
          fr: Refonte de l'entretien de recrutement backend
          en: Backend hiring interview revamp
        start: "2021"
        description:
          fr: |
            J'ai piloté la définition du nouvel exercice de recrutement backend (live coding), avec 6 autres ingénieurs contributeurs. Notre priorité était que l'exercice soit équitable pour tous les candidats.

            L'entretien est conçu pour ressembler au quotidien chez BlaBlaCar : le candidat est invité à considérer les intervieweurs comme des coéquipiers, ce qui permet aussi d'évaluer le savoir-être.
          en: |
            I led the definition of the new backend hiring exercise (live coding), with 6 other contributing engineers. Our priority was to make the exercise fair for every candidate.

            The interview is designed to feel like a day at work at BlaBlaCar: candidates are invited to treat the interviewers as teammates, which also helps assess soft skills.
