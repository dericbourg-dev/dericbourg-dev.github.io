name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Hugo version
        id: hugo-version
        run: echo "version=$(cat .hugo-version)" >> $GITHUB_OUTPUT

      - name: Install Hugo CLI
        env:
          HUGO_VERSION: ${{ steps.hugo-version.outputs.version }}
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Read Python tool versions
        id: python-versions
        run: |
          echo "weasyprint=$(cat .weasyprint-version)" >> $GITHUB_OUTPUT
          echo "check_jsonschema=$(cat .check-jsonschema-version)" >> $GITHUB_OUTPUT

      - name: Install WeasyPrint and check-jsonschema
        env:
          WEASYPRINT_VERSION: ${{ steps.python-versions.outputs.weasyprint }}
          CHECK_JSONSCHEMA_VERSION: ${{ steps.python-versions.outputs.check_jsonschema }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          pip install --break-system-packages \
            "weasyprint==${WEASYPRINT_VERSION}" \
            "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}"

      - name: Build with Hugo and generate PDFs
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Paris
        run: sh scripts/build.sh --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    # An index ping is advisory — a hiccup on IndexNow's side must never mark
    # the deploy as failed. The step itself still fails visibly in the log.
    continue-on-error: true
    steps:
      - name: Ping IndexNow with the sitemap URLs
        env:
          INDEXNOW_KEY: eb8cf8b7c4ec261dd3665cd45b8b8bec
          HOST: dericbourg.dev
        run: |
          urls=$( (curl -sS "https://${HOST}/fr/sitemap.xml"; curl -sS "https://${HOST}/en/sitemap.xml") \
            | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          payload=$(jq -n --arg host "$HOST" --arg key "$INDEXNOW_KEY" --argjson urlList "$urls" \
            '{host: $host, key: $key, urlList: $urlList}')
          status=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")
          echo "IndexNow responded $status"
          cat /tmp/indexnow-response.txt
          case "$status" in
            200|202) exit 0 ;;
            *) exit 1 ;;
          esac
