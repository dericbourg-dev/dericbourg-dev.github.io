baseURL = "https://dericbourg.dev/"
languageCode = "fr"
DefaultContentLanguage = "fr"
title = "Alban Dericbourg"

enableEmoji = true
enableRobotsTXT = true
enableGitInfo = true
localizedDates = true

# No blog/feed content — avoid publishing an RSS feed with bogus dates
disableKinds = ["rss"]

# Disable unused default taxonomies
[taxonomies]

# An explicit front-matter lastmod wins over the git date. Needed for the
# data-driven pages (/cv/, /references/): enableGitInfo only tracks their
# content/*.md file, which doesn't change when data/*.yaml does.
[frontmatter]
lastmod = ["lastmod", ":git", ":default"]

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputs]
home = ["html", "llms"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Needed: references use inline <small> tags in Markdown headings
      unsafe = true
